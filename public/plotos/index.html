<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
/* Biquote is the sole market-data provider for PLOTOS. */
(function (global) {
  'use strict';

  var BASE_URL = 'https://biquote.io';
  var REQUEST_TIMEOUT_MS = 10000;
  var RECONNECT_DELAYS_MS = [1000, 2000, 5000, 10000, 30000];
  var STREAM_TIMEOUT_MS = 45000;
  var CHUNK_SIZE = 100;
  var stream = {
    connection: null,
    symbols: [],
    tickHandlers: [],
    stateHandlers: [],
    reconnectTimer: null,
    reconnectAttempt: 0,
    starting: null,
    stopped: false,
    lastTickKey: '',
    lastTickAt: 0
  };

  function BiquoteError(message, status, retryAfter) {
    this.name = 'BiquoteError';
    this.message = message || 'Biquote request failed';
    this.status = status || 0;
    this.retryAfter = retryAfter || 0;
    if (Error.captureStackTrace) Error.captureStackTrace(this, BiquoteError);
  }
  BiquoteError.prototype = Object.create(Error.prototype);
  BiquoteError.prototype.constructor = BiquoteError;

  function uniqueSymbols(symbols) {
    var seen = Object.create(null);
    return (symbols || []).map(function (symbol) { return String(symbol || '').trim().toUpperCase(); })
      .filter(function (symbol) {
        if (!symbol || seen[symbol]) return false;
        seen[symbol] = true;
        return true;
      });
  }

  function reportState(state, detail) {
    stream.stateHandlers.slice().forEach(function (handler) {
      try { handler(state, detail || null); } catch (ignore) {}
    });
  }

  function request(path, options) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS);
    return fetch(BASE_URL + path, Object.assign({ signal: controller.signal }, options || {}))
      .then(function (response) {
        clearTimeout(timer);
        if (response.ok) return response.json();
        return response.json().catch(function () { return {}; }).then(function (body) {
          var retryAfter = Number(response.headers.get('Retry-After') || 0);
          throw new BiquoteError(body.message || body.error || ('Biquote HTTP ' + response.status), response.status, retryAfter);
        });
      })
      .catch(function (error) {
        clearTimeout(timer);
        if (error && error.name === 'AbortError') throw new BiquoteError('Biquote request timed out', 0, 0);
        throw error;
      });
  }

  function getSymbols() {
    return request('/api/symbols?liveOnly=true').then(function (items) {
      if (!Array.isArray(items)) throw new BiquoteError('Biquote returned an invalid symbol catalogue');
      return items;
    });
  }

  function getQuote(symbol, allowStale) {
    var safeSymbol = encodeURIComponent(String(symbol || '').trim().toUpperCase());
    return request('/api/' + safeSymbol + '?allowStale=' + (allowStale === false ? 'false' : 'true'));
  }

  function getQuotes(symbols) {
    var names = uniqueSymbols(symbols);
    if (!names.length) return Promise.resolve({});
    var chunks = [];
    for (var index = 0; index < names.length; index += CHUNK_SIZE) chunks.push(names.slice(index, index + CHUNK_SIZE));
    return chunks.reduce(function (chain, chunk) {
      return chain.then(function (all) {
        var query = chunk.map(function (symbol) { return 'symbols=' + encodeURIComponent(symbol); }).join('&');
        return request('/api/latest?' + query).then(function (result) {
          Object.keys(result || {}).forEach(function (symbol) { all[symbol] = result[symbol]; });
          return all;
        });
      });
    }, Promise.resolve({}));
  }

  function getHistoricalCandles(symbol, interval, limit) {
    var safeSymbol = encodeURIComponent(String(symbol || '').trim().toUpperCase());
    var supported = ['1m', '5m', '15m', '30m', '1h', '4h', '1d'];
    if (supported.indexOf(interval) < 0) return Promise.reject(new BiquoteError('Unsupported Biquote interval: ' + interval));
    var size = Math.max(1, Math.min(1000, Number(limit) || 300));
    return request('/api/' + safeSymbol + '/ohlc?interval=' + encodeURIComponent(interval) + '&limit=' + size)
      .then(function (payload) {
        if (!payload || !Array.isArray(payload.bars) || !payload.bars.length) throw new BiquoteError('Biquote returned invalid OHLC data');
        payload.bars.forEach(function (bar) {
          var timeValue = bar.openTime || bar.time || bar.t;
          var numericTime = typeof timeValue === 'string' && isNaN(Number(timeValue)) ? Date.parse(timeValue) : Number(timeValue);
          var values = [numericTime, bar.open, bar.high, bar.low, bar.close];
          if (values.some(function (value) { return !isFinite(Number(value)); })) throw new BiquoteError('Biquote returned malformed OHLC data');
          if (Number(bar.high) < Number(bar.low)) throw new BiquoteError('Biquote returned inverted OHLC range');
        });
        return payload;
      });
  }

  function clearReconnectTimer() {
    if (stream.reconnectTimer) {
      clearTimeout(stream.reconnectTimer);
      stream.reconnectTimer = null;
    }
  }

  function invokeInChunks(connection, method, symbols) {
    return connection.invoke(method, symbols);
  }

  function queueReconnect(reason) {
    if (stream.stopped || stream.reconnectTimer) return;
    var delay = RECONNECT_DELAYS_MS[Math.min(stream.reconnectAttempt, RECONNECT_DELAYS_MS.length - 1)];
    stream.reconnectAttempt += 1;
    reportState('reconnecting', { reason: reason || 'stream closed', delay: delay });
    stream.reconnectTimer = setTimeout(function () {
      stream.reconnectTimer = null;
      connect();
    }, delay);
  }

  function makeConnection() {
    if (!global.signalR || !global.signalR.HubConnectionBuilder) {
      throw new BiquoteError('SignalR client library is unavailable');
    }
    var connection = new global.signalR.HubConnectionBuilder()
      .withUrl(BASE_URL + '/hubs/tick', {
        skipNegotiation: true,
        transport: global.signalR.HttpTransportType.WebSockets
      })
      .withServerTimeout(STREAM_TIMEOUT_MS)
      .withKeepAliveInterval(15000)
      .withAutomaticReconnect(RECONNECT_DELAYS_MS)
      .build();

    function receiveTick(tick) {
      if (!tick || !tick.symbol) return;
      var key = String(tick.symbol).toUpperCase() + '|' + String(tick.bid || '') + '|' + String(tick.ask || '') + '|' + String(tick.time || tick.timestamp || '');
      var now = Date.now();
      if (key === stream.lastTickKey && now - stream.lastTickAt < 250) return;
      stream.lastTickKey = key;
      stream.lastTickAt = now;
      stream.tickHandlers.slice().forEach(function (handler) {
        try { handler(tick); } catch (ignore) {}
      });
    }
    connection.on('ReceiveTick', receiveTick);
    connection.on('Tick', receiveTick);
    connection.onreconnecting(function (error) { reportState('reconnecting', { reason: error && error.message || 'SignalR reconnecting' }); });
    connection.onreconnected(function () {
      stream.reconnectAttempt = 0;
      invokeInChunks(connection, 'Subscribe', stream.symbols).then(function () {
        reportState('live', { reconnected: true, count: stream.symbols.length });
      }).catch(function (error) {
        reportState('error', error);
        try { connection.stop(); } catch (ignore) {}
      });
    });
    connection.onclose(function (error) {
      if (stream.connection === connection) queueReconnect(error && error.message);
    });
    return connection;
  }

  function connect() {
    clearReconnectTimer();
    if (stream.stopped || !stream.symbols.length) return Promise.resolve();
    if (stream.starting) return stream.starting;
    if (!stream.connection) {
      try { stream.connection = makeConnection(); }
      catch (error) { reportState('error', error); queueReconnect(error.message); return Promise.reject(error); }
    }
    var connection = stream.connection;
    stream.starting = connection.start().then(function () {
      if (stream.connection !== connection) return;
      return invokeInChunks(connection, 'Subscribe', stream.symbols).then(function () {
        stream.reconnectAttempt = 0;
        reportState('live', { count: stream.symbols.length });
      });
    }).catch(function (error) {
      reportState('error', error);
      if (stream.connection === connection) {
        stream.connection = null;
        queueReconnect(error && error.message);
      }
      throw error;
    }).finally(function () { stream.starting = null; });
    return stream.starting;
  }

  function subscribeTicks(symbols, onTick, onState) {
    stream.symbols = uniqueSymbols(symbols);
    stream.stopped = false;
    if (typeof onTick === 'function' && stream.tickHandlers.indexOf(onTick) < 0) stream.tickHandlers.push(onTick);
    if (typeof onState === 'function' && stream.stateHandlers.indexOf(onState) < 0) stream.stateHandlers.push(onState);
    connect().catch(function () {});
    return function unsubscribe() {
      if (typeof onTick === 'function') stream.tickHandlers = stream.tickHandlers.filter(function (handler) { return handler !== onTick; });
      if (typeof onState === 'function') stream.stateHandlers = stream.stateHandlers.filter(function (handler) { return handler !== onState; });
    };
  }

  function stopTicks() {
    stream.stopped = true;
    clearReconnectTimer();
    var connection = stream.connection;
    stream.connection = null;
    stream.starting = null;
    if (connection) return connection.stop().catch(function () {});
    return Promise.resolve();
  }

  global.BiquoteAdapter = {
    name: 'Biquote',
    baseUrl: BASE_URL,
    getSymbols: getSymbols,
    getQuote: getQuote,
    getQuotes: getQuotes,
    getHistoricalCandles: getHistoricalCandles,
    subscribeTicks: subscribeTicks,
    stopTicks: stopTicks,
    Error: BiquoteError
  };
})(window);

</script>

function qt(s){return Q[s]&&Q[s].bid>0?Q[s]:null}

function pnlUSD(p,px){var S=SYMBOLS[p.symbol];var d=p.side==='buy'?px-p.entry:p.entry-px;return toUSD(p.symbol,d*p.lots*S.contract)}
function accPositions(a){return DB.positions.filter(function(p){return p.accId===a.id&&SUPPORTED_SYMBOLS[p.symbol]})}
function accOrders(a){return DB.orders.filter(function(o){return o.accId===a.id&&o.state==='PENDING'&&SUPPORTED_SYMBOLS[o.symbol]})}
function tradePrice(sym,side,q){q=q||qt(sym);if(!q)return 0;return side==='buy'?q.ask:q.bid}
function marginFor(a,sym,side,lots,px){var S=SYMBOLS[sym],lev=+a.leverage||0;

function usedMargin(a){return accPositions(a).reduce(function(t,p){var q=qt(p.symbol);
 var px=tradePrice(p.symbol,p.side,q)||p.entry;return t+marginFor(a,p.symbol,p.side,p.lots,px)},0)}
function equity(a){return a.balance+accPositions(a).reduce(function(t,p){var q=qt(p.symbol);

  profitPct:ch?(eq-a.size)/a.size*100:0,
  dailyPL:eq-(+a.dayStartEq||0),
  dailyLossPct:a.dayStartEq>0?Math.max(0,(a.dayStartEq-eq)/a.dayStartEq*100):0,

function validateOrder(a,sym,side,lots,type,price,sl,tp){
 var e=canTrade(a);if(e)return e;

 if(type!=='MARKET'&&type!=='LIMIT'&&type!=='STOP')return'Invalid order type';
 var stepErr=Math.abs(Math.round(lots*100)-lots*100)>0.005;
 if(!(lots>=0.01&&lots<=100)||stepErr)return'Volume must be 0.01–100, step 0.01';

 if(type!=='MARKET'&&!(price>0))return'Enter trigger price';

function closePosition(p,px,reason){var a=DB.accounts.find(function(x){return x.id===p.accId});if(!a)return 0;
 if(!(px>0)||!isFinite(px))return 0;
 var gross=pnlUSD(p,px);
 var comm=+(p.lots*(DB.riskRules.commissionPerLot||0)).toFixed(2);
 var net=+(gross-comm).toFixed(2);
 a.balance=+(a.balance+net).toFixed(2);
 var dk=todayKey();if(a.days.indexOf(dk)<0)a.days.push(dk);
 DB.history.unshift({id:uid(),accId:a.id,userId:a.userId,symbol:p.symbol,side:p.side,lots:p.lots,entry:p.entry,exit:px,sl:p.sl,tp:p.tp,pnl:net,comm:comm,reason:reason,note:'',openedAt:p.openedAt,closedAt:Date.now()});
 DB.positions=DB.positions.filter(function(x){return x.id!==p.id});
 a.curve.push({t:Date.now(),e:a.balance});if(a.curve.length>400)a.curve.shift();

 notify(a.userId,net>=0?'success':'warn',p.symbol+' position closed',p.side.toUpperCase()+' '+p.lots+' lots · '+(net>=0?'+':'')+net.toFixed(2)+' USD net · '+(REASON[reason]||reason));
 return net}
function closePartial(p,frac){
 var a=DB.accounts.find(function(x){return x.id===p.accId});if(!a)return;
 frac=Math.max(0,Math.min(1,+frac||0));if(!(frac>0))return;
 var q=qt(p.symbol);if(!q){toast('No price','dn');return}
 var px=p.side==='buy'?q.bid:q.ask;
 var closeLots=Math.round(p.lots*frac*100)/100;
 if(p.lots-closeLots<0.01){closePosition(p,px,'market');renderStrip();return}
 var gross=pnlUSD(p,px)*(closeLots/p.lots);
 var comm=+(closeLots*(DB.riskRules.commissionPerLot||0)).toFixed(2);
 var net=+(gross-comm).toFixed(2);
 a.balance=+(a.balance+net).toFixed(2);
 DB.history.unshift({id:uid(),accId:a.id,userId:a.userId,symbol:p.symbol,side:p.side,lots:closeLots,entry:p.entry,exit:px,sl:p.sl,tp:p.tp,pnl:net,comm:comm,reason:'partial',note:'',openedAt:p.openedAt,closedAt:Date.now()});
 p.lots=+(p.lots-closeLots).toFixed(2);
 audit(user()?user().email:a.userId,'Position Closed',p.symbol,'Partial '+Math.round(frac*100)+'% · net '+net.toFixed(2));
 toast('Closed '+Math.round(frac*100)+'% — net '+(net>=0?'+':'')+net.toFixed(2),net>=0?'up':'dn');
 save();renderStrip();paintTrade(true);chartDrawLines()}
function closeAll(a,reason){var n=0;

  closePosition(p,p.side==='buy'?q.bid:q.ask,reason);n++});return n}
function RiskEval(a){
 var M=accMetrics(a),R=DB.riskRules,ch=a.ch,out={state:'ACTIVE',dailyLossPct:M.dailyLossPct,ddPct:M.ddFromStartPct,ml:M.ml};
 if(M.um>0&&M.ml<R.stopoutLevel){out.state='BREACHED';out.why='stopout';return out}
 if(a.kind!=='PAPER'&&ch&&ch.status==='ACTIVE'){
  var warn=(R.warnAt||80)/100;
  if(M.eq<=M.totFloor){out.state='BREACHED';out.why='maxdd';return out}
  if(M.dailyLossPct>=ch.dailyLossPct){out.state='BREACHED';out.why='daily';return out}
  if(M.dailyLossPct>=ch.dailyLossPct*warn)out.state='WARNING';
  else if(M.ddFromStartPct>=ch.maxDDPct*warn)out.state='WARNING';
  if(ch.maxDays>0&&(Date.now()-ch.startedAt)/864e5>=ch.maxDays){out.state='BREACHED';out.why='maxdays';return out}}
 return out}
function rejectPending(a,o,why){o.state='REJECTED';o.status='REJECTED';o.reason=why;o.log.push({t:Date.now(),s:'REJECTED',why:why});

function engineTick(){
 DB.accounts.forEach(function(a){try{
  var dk=todayKey();
  if(a.dayKey!==dk){
   var sw=0;
   accPositions(a).forEach(function(p){var c=+(p.lots*(SYMBOLS[p.symbol].swap||0)).toFixed(2);
    if(c){p.swap=+(p.swap+c).toFixed(2);a.balance=+(a.balance+c).toFixed(2);sw+=c}});
   a.dayKey=dk;a.dayStartEq=equity(a);a.w1=false;a.w2=false;
   if(sw){a.swapTotal=+((a.swapTotal||0)+sw).toFixed(2);audit('engine','Swap Charged','account '+a.login,sw.toFixed(2)+' overnight')}
   save()}
  var eqNow=equity(a);if(eqNow>a.highEq)a.highEq=eqNow;
  accPositions(a).forEach(function(p){var q=qt(p.symbol);if(!q||!marketOpen(p.symbol))return;
   if(p.ts>0){var S=SYMBOLS[p.symbol],dist=p.ts*S.pip;
    if(p.side==='buy'&&(q.bid-p.entry)>dist){var ns=+(q.bid-dist).toFixed(S.digits);if(!p.sl||ns>p.sl){p.sl=ns;a._tsUpd=true}}
    if(p.side==='sell'&&(p.entry-q.ask)>dist){var ns2=+(q.ask+dist).toFixed(S.digits);if(!p.sl||ns2<p.sl){p.sl=ns2;a._tsUpd=true}}}
   if(p.sl&&(p.side==='buy'?q.bid<=p.sl:q.ask>=p.sl)){closePosition(p,p.sl,'sl');audit('engine','SL Hit',p.symbol,'');return}
   if(p.tp&&(p.side==='buy'?q.bid>=p.tp:q.ask<=p.tp)){closePosition(p,p.tp,'tp');audit('engine','TP Hit',p.symbol,'')}});
  if(a._tsUpd){a._tsUpd=false;if(view==='charts'){renderStrip();chartDrawLines()}save()}
  accOrders(a).forEach(function(o){var q=qt(o.symbol);if(!q||!marketOpen(o.symbol))return;
   var hit=o.type==='LIMIT'?(o.side==='buy'?q.ask<=o.price:q.bid>=o.price)
          :o.type==='STOP'?(o.side==='buy'?q.ask>=o.price:q.bid<=o.price):false;
   if(hit){
    var fillErr=validateOrder(a,o.symbol,o.side,o.lots,'MARKET',0,null,null);
    if(fillErr){rejectPending(a,o,fillErr);return}
    var p2=openPosition(a,o.symbol,o.side,o.lots,o.sl,o.tp,o.type.toLowerCase());
    o.state='FILLED';o.status='FILLED';o.posId=p2.id;o.log.push({t:Date.now(),s:'FILLED'});
    notify(a.userId,'info','Order triggered',o.symbol+' '+o.side.toUpperCase()+' '+o.lots+' lots');
    if(view==='charts'){chartDrawLines();renderStrip()}}});
  var rv=RiskEval(a);
  if(rv.state==='BREACHED'){

   if(rv.why==='stopout'&&accPositions(a).length){

   else if(rv.why==='daily'){failCh(a,'Daily loss limit breached')}
   else if(rv.why==='maxdays'){failCh(a,'Maximum trading days reached')}}
  else if(rv.state==='WARNING'&&a.kind!=='PAPER'){
   var ch=a.ch;
   if(!a.w1&&rv.dailyLossPct>=ch.dailyLossPct*(DB.riskRules.warnAt||80)/100){a.w1=true;notify(a.userId,'warn','Daily loss warning',rv.dailyLossPct.toFixed(1)+'% of '+ch.dailyLossPct+'% daily limit used')}
   if(!a.w2&&rv.ddPct>=ch.maxDDPct*(DB.riskRules.warnAt||80)/100){a.w2=true;notify(a.userId,'warn','Drawdown warning',rv.ddPct.toFixed(1)+'% of '+ch.maxDDPct+'% used')}}
  var ch2=a.ch;

   if(M.profitPct>=ch2.profitPct&&a.days.length>=ch2.minDays)passCh(a)}
 }catch(e){}})}

  }).filter(function(bar){return bar.time>0&&bar.open>0&&bar.high>0&&bar.low>0&&bar.close>0&&!seen[bar.time]&&(seen[bar.time]=true)});

function mwCategoryMatches(s){
 if(mwCat==='all')return true;
 if(mwCat==='favorites')return DB.settings.favorites.indexOf(s)>=0;
 var c=String(SYMBOLS[s].cat||'').toLowerCase(),d=String(SYMBOLS[s].desc||'').toLowerCase();
 if(mwCat==='Forex')return c==='forex';
 if(mwCat==='Metals')return c==='metals'||c==='commodity'||/gold|xau/.test(s+' '+d);

function symbolManager(){
 var selected=(Array.isArray(DB.settings.watchlist)?DB.settings.watchlist.slice():SYIDS.slice()).filter(function(s){return SYMBOLS[s]});
 var query='';
 function draw(){
  var q=query.toLowerCase(),all=Object.keys(SYMBOLS).filter(function(s){return !selected.includes(s)&&(!q||s.toLowerCase().indexOf(q)>=0||String(SYMBOLS[s].desc||'').toLowerCase().indexOf(q)>=0)});
  var picked=selected.map(function(s,i){return'<div class="smrow" draggable="true" data-sm="'+s+'"><span class="smhandle">☷</span><span><b>'+s+'</b><small>'+esc(SYMBOLS[s].desc||'')+'</small></span><button class="mbtn" data-smup="'+i+'">↑</button><button class="mbtn" data-smdn="'+i+'">↓</button><button class="mbtn danger" data-smrm="'+s+'">×</button></div>'}).join('');
  var groups={};all.forEach(function(s){var c=SYMBOLS[s].cat||'Other';(groups[c]||(groups[c]=[])).push(s)});
  var avail=Object.keys(groups).sort().map(function(c){return'<div class="smgroup"><b>'+esc(c)+'</b>'+groups[c].map(function(s){return'<button class="smavail" data-smadd="'+s+'"><span>'+s+'</span><small>'+esc(SYMBOLS[s].desc||'')+'</small><i>＋</i></button>'}).join('')+'</div>'}).join('');
  $('#modalBox').innerHTML='<h4>Symbols</h4><div class="smhint">Selected symbols · drag ☷ to reorder</div><div class="srch"><input id="smSearch" placeholder="Search symbol or folder…" value="'+esc(query)+'"></div><div class="smsection"><div class="smcap">SELECTED</div><div id="smSelected">'+(picked||'<div class="empty">No symbols selected</div>')+'</div></div><div class="smsection"><div class="smcap">ADD FROM FOLDERS</div><div id="smAvailable">'+(avail||'<div class="empty">No matching symbols</div>')+'</div></div><div class="mrow-btns"><button class="btn ghost" id="smCancel">Cancel</button><button class="btn" id="smSave">Apply symbols</button></div>';
  $('#smSearch').oninput=function(){query=this.value;draw()};$('#smCancel').onclick=closeModal;
  $$('[data-smadd]').forEach(function(b){b.onclick=function(){selected.push(b.getAttribute('data-smadd'));draw()}});
  $$('[data-smrm]').forEach(function(b){b.onclick=function(){selected=selected.filter(function(s){return s!==b.getAttribute('data-smrm')});draw()}});
  $$('[data-smup]').forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-smup');if(i>0){var x=selected.splice(i,1)[0];selected.splice(i-1,0,x);draw()}}});
  $$('[data-smdn]').forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-smdn');if(i<selected.length-1){var x=selected.splice(i,1)[0];selected.splice(i+1,0,x);draw()}}});
  var drag=null;$$('[data-sm]').forEach(function(r){r.ondragstart=function(){drag=r.getAttribute('data-sm')};r.ondragover=function(e){e.preventDefault()};r.ondrop=function(e){e.preventDefault();var target=r.getAttribute('data-sm'),a=selected.indexOf(drag),b=selected.indexOf(target);if(a>=0&&b>=0){selected.splice(a,1);selected.splice(b,0,drag);draw()}}});
  $('#smSave').onclick=function(){DB.settings.watchlist=selected.slice();save();installBiquoteSymbols(cachedBiquoteSymbols());closeModal();if(view==='quotes')renderQuotes();if(view==='charts')openCharts();toast('Symbols updated','up')}
 }
 modal('');draw()

 $$('[data-adj]').forEach(function(b){b.onclick=function(){

 $$('[data-rst]').forEach(function(b){b.onclick=function(){

 $$('[data-fund]').forEach(function(b){b.onclick=function(){

/* live paint */
function feedPaint(){
 var sessRow=$('#sessRow');if(sessRow)paintSessions();
 if(view==='quotes'){SYIDS.forEach(function(s){var q=Q[s],S=SYMBOLS[s];
  var b=$('#mb-'+s),ae=$('#ma-'+s);
  if(b&&ae){
   if(q.bid>0){b.innerHTML=pipHTML(q.bid,S.digits);ae.innerHTML=pipHTML(q.ask,S.digits);
    var row=b.closest('.mrow');if(row)row.classList.remove('off')}
   else{b.textContent='—';ae.textContent='—'}}
   var hi=$('#mh-'+s),lo=$('#ml-'+s);if(hi)hi.textContent=q.high>0?pxf(q.high,S.digits):'—';if(lo)lo.textContent=q.low>0?pxf(q.low,S.digits):'—';
   var c=$('#mc-'+s);
  if(c&&q.open){var ch=(q.last-q.open)/q.open*100;
   c.textContent=(ch>=0?'+':'')+ch.toFixed(2)+'%';c.style.color=ch>=0?'var(--up)':'var(--dn)'}});
 }
 if(view==='charts'){var s2=termSym,q2=Q[s2],S2=SYMBOLS[s2];
  var ms=$('#mSymName');if(ms)ms.textContent=s2;
  var mb=$('#mBid');if(mb)mb.textContent=q2.bid>0?pxf(q2.bid,S2.digits):'—';
  var ma=$('#mAsk');if(ma)ma.textContent=q2.ask>0?pxf(q2.ask,S2.digits):'—';
  var mst=$('#mSymStatus');if(mst)mst.className='status '+(q2.status==='LIVE'?'live':'');
  var mss=$('#mSymState');if(mss)mss.textContent=q2.status==='LIVE'?'LIVE':(q2.status||'OFFLINE');
  var sp2=$('#qSellPx');
  if(sp2){sp2.innerHTML=q2.bid>0?bigPx(q2.bid,S2.digits):'—';
   var bp=$('#qBuyPx');if(bp)bp.innerHTML=q2.bid>0?bigPx(q2.ask,S2.digits):'—';
   var spr=$('#qSpread');if(spr)spr.textContent='SPREAD '+(q2.bid>0&&q2.ask>0?pxf(Math.max(0,q2.ask-q2.bid),S2.digits):'—')}
  var ob=document.querySelector('.odbar');
  if(ob)ob.classList.toggle('closed',!marketOpen(s2));
  var mc2=$('#mktChip');
  if(mc2)mc2.style.display=marketOpen(s2)?'none':'';
  scheduleDrawRedraw();paintCmeta();
  var acc=myAcc();
  if(acc)accPositions(acc).forEach(function(p){
   var se=document.querySelector('[data-spnl="'+p.id+'"]');
   var qq=Q[p.symbol];var cx=qq.bid>0?(p.side==='buy'?qq.bid:qq.ask):0;
   if(se){var pnl=cx?pnlUSD(p,cx):0;
    se.textContent=cx?((pnl>=0?'+':'')+pnl.toFixed(2)):'—';se.className='pl '+(pnl>=0?'up':'dn')}})}
 if(view==='trade'){try{paintTrade(false)}catch(e){}}
 if(view==='hist'&&histTab==='positions'){var a4=myAcc();
  if(a4)accPositions(a4).forEach(function(p){var qq=Q[p.symbol];
   var cx=qq.bid>0?(p.side==='buy'?qq.bid:qq.ask):0;
   var pe=document.querySelector('#histBody [data-pnl="'+p.id+'"]');
   if(pe){var pnl=cx?pnlUSD(p,cx):0;pe.textContent=cx?((pnl>=0?'+':'')+pnl.toFixed(2)):'—';pe.className='pnl '+(pnl>=0?'up':'dn')}
   var ce=document.querySelector('#histBody [data-cur="'+p.id+'"]');
   if(ce)ce.textContent=cx?pxf(cx,SYMBOLS[p.symbol].digits):'—'})}
 if(view==='prop'){var a3=myAcc();
  if(a3){var M3=accMetrics(a3);
   var pe=$('#pEq');if(pe)pe.textContent=money(M3.eq);
   var pb=$('#pBal');if(pb)pb.textContent=money(a3.balance);
   var rf=$('#rFloat');if(rf){var fl3=M3.eq-a3.balance;rf.textContent=(fl3>=0?'+':'')+money(fl3);rf.className=fl3>=0?'up':'dn'}
   var rfr=$('#rFree');if(rfr)rfr.textContent=money(M3.free);
   var rml=$('#rMl');if(rml)rml.textContent=M3.um>0?M3.ml.toFixed(0)+'%':'—';
   var rdl=$('#rDaily');if(rdl)rdl.textContent=M3.dailyLossPct.toFixed(2)+'%';
   var rr=RiskEval(a3),rt=$('#rRisk');if(rt){rt.textContent=rr.state==='BREACHED'?'RISK BREACHED':rr.state==='WARNING'?'RISK WARNING':'RISK CLEAR';var box=rt.parentNode;box.className='riskcard state '+(rr.state==='BREACHED'?'dn':rr.state==='WARNING'?'warn':'');var rs=box.querySelector('.sub');if(rs)rs.textContent=a3.riskLock||'Trading permissions active'}
   var ce=$('#chEq');if(ce)ce.textContent=money(M3.eq);
   var ch3=a3.ch;
   if(ch3&&ch3.status==='ACTIVE'){var p1=$('#chP1');
    if(p1)p1.style.width=Math.min(100,Math.max(0,M3.profitPct)/ch3.profitPct*100)+'%';
    var p2=$('#chP2');if(p2){p2.style.width=Math.min(100,M3.dailyLossPct/ch3.dailyLossPct*100)+'%';p2.className=M3.dailyLossPct/ch3.dailyLossPct>0.85?'dang':M3.dailyLossPct/ch3.dailyLossPct>0.6?'warn':''}
    var p3=$('#chP3');if(p3){p3.style.width=Math.min(100,M3.ddFromStartPct/ch3.maxDDPct*100)+'%';p3.className=M3.ddFromStartPct/ch3.maxDDPct>0.85?'dang':M3.ddFromStartPct/ch3.maxDDPct>0.6?'warn':''}}}}
 updateBadges()}
function pipHTML(v,d){if(!(v>0))return'—';var s=pxf(v,d),n=d>=3?2:1;
 return'<small>'+s.slice(0,-n)+'</small><b>'+s.slice(-n)+'</b>'}
setInterval(function(){try{engineTick()}catch(e){}},600);

/* boot */
(function boot(){
 try{
  var ref=new URLSearchParams(location.search).get('ref');
  if(ref){try{localStorage.setItem('plotos_ref',ref)}catch(e){}}
 }catch(e){}
 try{loadDB()}catch(e){DB=freshDB()}
 applyTheme();applyLang();
 if(DB.settings.lastSym&&SYMBOLS[DB.settings.lastSym])termSym=DB.settings.lastSym;
 if(DB.settings.lastTf&&TFSEC[DB.settings.lastTf])chart.tf=DB.settings.lastTf;
 startFeeds();
 cloudInit().then(function(){return seed()}).then(function(){
  if(DB.session&&user()){try{enterApp()}catch(e){showErr(e);renderAuth()}}
  else renderAuth()
 }).catch(function(e){
  CLOUD.online=false;CLOUD.lastError=e;
  document.body.setAttribute('data-cloud-error','1');
  showErr(new Error('Cloud database unavailable. Local trading data is disabled until reconnection.'));
  renderAuth()
 });
 ensureChartLib();
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
 navigator.serviceWorker.register('./sw.js').catch(function(){});
}
